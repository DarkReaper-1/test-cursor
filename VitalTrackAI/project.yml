name: VitalTrackAI
options:
  bundleIdPrefix: com.vitaltrack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  VitalTrackAIPackages:
    path: .

targets:
  VitalTrackAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VitalTrackAI
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitaltrack.ai
        PRODUCT_NAME: VitalTrackAI
        INFOPLIST_FILE: VitalTrackAI/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: VitalTrackAI/Resources/VitalTrackAI.entitlements
    dependencies:
      - package: VitalTrackAIPackages
        product: VitalTrackCore
      - package: VitalTrackAIPackages
        product: VitalTrackData
      - package: VitalTrackAIPackages
        product: VitalTrackHealthKit
      - package: VitalTrackAIPackages
        product: VitalTrackBluetooth
      - package: VitalTrackAIPackages
        product: VitalTrackAIInsights
      - package: VitalTrackAIPackages
        product: VitalTrackNotifications
      - package: VitalTrackAIPackages
        product: VitalTrackExport
      - package: VitalTrackAIPackages
        product: VitalTrackDesignSystem
      - package: VitalTrackAIPackages
        product: VitalTrackFeatures
    info:
      path: VitalTrackAI/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSHealthShareUsageDescription: VitalTrack AI reads heart rate, heart rate variability, and blood pressure that other apps or FDA-cleared devices already saved in Apple Health. VitalTrack AI does not estimate blood pressure from the camera.
        NSHealthUpdateUsageDescription: VitalTrack AI can save blood pressure readings you enter from an FDA-cleared external monitor into Apple Health when you choose to export them.
        NSCameraUsageDescription: VitalTrack AI uses the camera only for heart rate measurement via photoplethysmography (PPG). The camera does not measure blood pressure.
        NSBluetoothAlwaysUsageDescription: VitalTrack AI uses Bluetooth to connect to compatible FDA-cleared blood pressure monitors so you can import cuff readings. Bluetooth is not used to estimate blood pressure from the phone itself.
        NSBluetoothPeripheralUsageDescription: VitalTrack AI connects to external blood pressure monitors over Bluetooth to receive measurements from the cuff.

  VitalTrackAIUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UI
    dependencies:
      - target: VitalTrackAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitaltrack.ai.uitests
        TEST_TARGET_NAME: VitalTrackAI

schemes:
  VitalTrackAI:
    build:
      targets:
        VitalTrackAI: all
    test:
      targets:
        - VitalTrackAIUITests
    run:
      config: Debug
