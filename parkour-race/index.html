<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Parkour Dash — Rooftop Racing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #10122b; touch-action: none;
    font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
  #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; z-index: 10; transition: opacity .25s ease; }
  .hidden { opacity: 0 !important; pointer-events: none !important; }

  /* ---- main menu ---- */
  #menu { background: linear-gradient(180deg, rgba(20,16,60,.55), rgba(20,16,60,.15) 40%, rgba(20,16,60,.6)); }
  .logo { text-align: center; margin-bottom: 6vh; transform: rotate(-3deg); }
  .logo .l1 { font-size: clamp(44px, 11vw, 92px); font-weight: 900; color: #ffd93b; letter-spacing: 2px;
    text-shadow: 0 5px 0 #d97b00, 0 10px 24px rgba(0,0,0,.45); font-style: italic; }
  .logo .l2 { font-size: clamp(26px, 6.4vw, 54px); font-weight: 900; color: #fff; letter-spacing: 10px;
    text-shadow: 0 4px 0 #3f3fae, 0 8px 20px rgba(0,0,0,.4); margin-top: -6px; }
  .level-pill { background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.35); color: #fff;
    font-size: clamp(16px, 3.4vw, 24px); font-weight: 800; padding: 8px 26px; border-radius: 999px; margin-bottom: 4vh; letter-spacing: 1px; }
  .tap-hint { color: #fff; font-weight: 900; font-size: clamp(20px, 4.6vw, 32px); letter-spacing: 3px;
    animation: pulse 1.1s ease-in-out infinite; text-shadow: 0 3px 10px rgba(0,0,0,.5); }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.09); opacity: .65; } }
  .controls-hint { position: absolute; bottom: max(4vh, env(safe-area-inset-bottom)); color: rgba(255,255,255,.75);
    font-size: clamp(12px, 2.6vw, 16px); font-weight: 600; text-align: center; line-height: 1.7; padding: 0 20px; }
  .controls-hint b { color: #ffd93b; }

  /* ---- countdown ---- */
  #countdown { pointer-events: none; z-index: 12; }
  #countdown-num { font-size: clamp(90px, 26vw, 220px); font-weight: 900; color: #ffd93b; font-style: italic;
    text-shadow: 0 8px 0 #d97b00, 0 16px 40px rgba(0,0,0,.5); transform: scale(0); }
  #countdown-num.pop { animation: cd-pop .95s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes cd-pop { 0% { transform: scale(0) rotate(-14deg); opacity: 1; } 30% { transform: scale(1.15) rotate(2deg); }
    55% { transform: scale(1); } 100% { transform: scale(1); opacity: 0; } }

  /* ---- HUD ---- */
  #hud { pointer-events: none; z-index: 8; justify-content: flex-start; }
  #position-badge { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; color: #fff;
    font-weight: 900; font-style: italic; line-height: .9; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
  #position-badge .num { font-size: clamp(44px, 10vw, 76px); color: #ffd93b; }
  #position-badge .suffix { font-size: clamp(18px, 4vw, 28px); color: #ffd93b; }
  #position-badge .total { font-size: clamp(13px, 2.8vw, 18px); opacity: .85; display: block; margin-top: 4px; font-style: normal; }
  #level-badge { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px; color: rgba(255,255,255,.9);
    font-weight: 800; font-size: clamp(13px, 3vw, 18px); background: rgba(0,0,0,.28); padding: 7px 14px; border-radius: 999px; }

  #progress-wrap { position: absolute; top: max(18px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: min(46vw, 320px); }
  #progress-track { height: 6px; background: rgba(0,0,0,.35); border-radius: 4px; position: relative; }
  .prog-dot { position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.35);
    transform: translate(-50%, -50%); transition: left .2s linear; }
  .prog-dot.player { width: 16px; height: 16px; z-index: 2; box-shadow: 0 0 8px rgba(255,217,59,.9); }
  .prog-flag { position: absolute; right: -6px; top: -14px; font-size: 14px; }

  .toast { position: absolute; left: 50%; top: 30%; transform: translateX(-50%) scale(0); font-weight: 900; font-style: italic;
    font-size: clamp(30px, 8vw, 58px); letter-spacing: 2px; pointer-events: none; white-space: nowrap;
    text-shadow: 0 4px 0 rgba(0,0,0,.28), 0 8px 24px rgba(0,0,0,.35); }
  .toast.show { animation: toast-in 1s cubic-bezier(.2,1.7,.4,1) forwards; }
  @keyframes toast-in { 0% { transform: translateX(-50%) scale(0) rotate(-8deg); opacity: 1; }
    28% { transform: translateX(-50%) scale(1.12) rotate(2deg); } 45% { transform: translateX(-50%) scale(1); }
    75% { transform: translateX(-50%) scale(1); opacity: 1; } 100% { transform: translateX(-50%) scale(.92) translateY(-24px); opacity: 0; } }

  #speedlines { position: fixed; inset: 0; pointer-events: none; z-index: 6; opacity: 0; transition: opacity .18s;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(255,255,255,.16) 78%, rgba(255,240,180,.34) 100%); }
  #fade { position: fixed; inset: 0; background: #10122b; pointer-events: none; z-index: 20; opacity: 0; transition: opacity .3s; }

  /* ---- results ---- */
  #results { background: rgba(14,12,42,.72); z-index: 11; backdrop-filter: blur(3px); }
  #result-title { font-size: clamp(40px, 11vw, 90px); font-weight: 900; font-style: italic; letter-spacing: 2px;
    margin-bottom: 1vh; text-shadow: 0 5px 0 rgba(0,0,0,.3), 0 12px 30px rgba(0,0,0,.5); }
  #result-sub { color: rgba(255,255,255,.85); font-weight: 700; font-size: clamp(15px, 3.4vw, 22px); margin-bottom: 3.5vh; }
  #standings { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4vh; width: min(78vw, 340px); }
  .standing-row { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.09); border-radius: 10px;
    padding: 7px 14px; color: #fff; font-weight: 700; font-size: clamp(13px, 3vw, 17px); }
  .standing-row.me { background: rgba(255,217,59,.22); border: 1.5px solid #ffd93b; }
  .standing-row .place { width: 34px; font-weight: 900; font-style: italic; color: #ffd93b; font-size: 1.1em; }
  .standing-row .swatch { width: 13px; height: 13px; border-radius: 50%; }
  .big-btn { pointer-events: auto; cursor: pointer; border: none; color: #4a2c00; background: linear-gradient(180deg, #ffe36b, #ffc21e);
    font-family: inherit; font-weight: 900; font-size: clamp(20px, 5vw, 30px); letter-spacing: 3px; padding: 16px 64px;
    border-radius: 16px; box-shadow: 0 6px 0 #c98a00, 0 12px 26px rgba(0,0,0,.4); transition: transform .08s; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c98a00, 0 6px 14px rgba(0,0,0,.4); }
  .small-btn { pointer-events: auto; cursor: pointer; border: none; background: rgba(255,255,255,.14); color: #fff;
    font-family: inherit; font-weight: 800; font-size: clamp(13px, 3vw, 17px); letter-spacing: 1px; padding: 10px 26px;
    border-radius: 999px; margin-top: 14px; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="speedlines"></div>

<div id="menu" class="screen">
  <div class="logo"><div class="l1">PARKOUR</div><div class="l2">DASH</div></div>
  <div class="level-pill" id="menu-level">LEVEL 1</div>
  <div class="tap-hint">TAP TO RACE</div>
  <div class="controls-hint">
    <b>Drag</b> or <b>A / D</b> to steer &nbsp;·&nbsp; you run, jump, vault &amp; flip <b>automatically</b><br/>
    Hit <b>yellow ramps</b> &amp; <b>speed pads</b> to boost — don't bump the walls!
  </div>
</div>

<div id="countdown" class="screen hidden"><div id="countdown-num"></div></div>

<div id="hud" class="screen hidden">
  <div id="position-badge"><span class="num">8</span><span class="suffix">th</span><span class="total">of 8</span></div>
  <div id="level-badge">LEVEL 1</div>
  <div id="progress-wrap"><div id="progress-track"><span class="prog-flag">🏁</span></div></div>
  <div class="toast" id="toast"></div>
</div>

<div id="results" class="screen hidden">
  <div id="result-title">2nd!</div>
  <div id="result-sub">Level 1 complete</div>
  <div id="standings"></div>
  <button class="big-btn" id="btn-next">NEXT</button>
  <button class="small-btn" id="btn-retry">RETRY</button>
</div>

<div id="fade"></div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
